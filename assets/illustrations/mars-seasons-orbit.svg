<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Mars and its seasons</title><desc id="desc">Mars follows an elliptical orbit around the Sun with a tilted axis.</desc><defs><radialGradient id="sun"><stop stop-color="#fff2a6"/><stop offset="1" stop-color="#f5a623"/></radialGradient><linearGradient id="mars"><stop stop-color="#f6b27d"/><stop offset="1" stop-color="#8e3424"/></linearGradient></defs><rect width="800" height="450" rx="24" fill="#101a36"/><ellipse cx="400" cy="225" rx="275" ry="145" fill="none" stroke="#7386b5" stroke-width="3" stroke-dasharray="8 8" transform="rotate(-14 400 225)"/><circle cx="400" cy="225" r="45" fill="url(#sun)"/><circle cx="648" cy="155" r="31" fill="url(#mars)"/><path d="M648 118 L648 192" stroke="#b9e2ff" stroke-width="4"/><path d="M635 132 L661 178" stroke="#b9e2ff" stroke-width="3"/><path d="M548 105 Q585 73 622 104" fill="none" stroke="#f5d58a" stroke-width="4"/><path d="M612 93 L624 104 L610 110" fill="none" stroke="#f5d58a" stroke-width="4"/><text x="400" y="310" text-anchor="middle" fill="#fff2a6" font-size="24" font-family="Arial,sans-serif">Sun</text><text x="648" y="220" text-anchor="middle" fill="#f9d4c1" font-size="23" font-family="Arial,sans-serif">Mars</text><text x="400" y="390" text-anchor="middle" fill="#e9efff" font-size="22" font-family="Arial,sans-serif">Tilt + elliptical orbit shape seasonal patterns</text></svg>