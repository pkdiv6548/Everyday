name: Everyday content audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit live Data Lab public API providers
        run: node scripts/data-lab-api-health-audit.mjs
      - name: Check JavaScript syntax
        run: node --check scripts/ci-test-integration-check.mjs && node --check scripts/dark-mode-browser-test.mjs && node --check scripts/responsive-smoke-test.mjs
      - name: Check newsletter demo privacy and submission behavior
        run: node scripts/newsletter-demo-regression-check.mjs
      - name: Check remaining JavaScript syntax
        run: node --check scripts/offline-cache-recovery-test.mjs && node --check scripts/service-worker-registration-test.mjs && node --check scripts/weather-race-condition-test.mjs && node --check scripts/weather-api-validation-test.mjs && node --check app.js && node --check stories-extra.js && node --check sw.js && node --check tests/load/k6-site.js && node --check scripts/category-coverage.mjs && node --check scripts/content-audit.mjs && node --check scripts/explore-state-check.mjs && node --check scripts/image-relevance-audit.mjs && node --check scripts/source-provenance-audit.mjs && node --check scripts/runtime-selector-check.mjs && node --check scripts/time-page-regression-check.mjs && node --check scripts/time-page-browser-test.mjs && node --check scripts/interactive-controls-test.mjs && node --check scripts/explore-search-browser-test.mjs && node --check scripts/explore-search-edge-cases-test.mjs && node --check scripts/site-smoke-test.mjs
      - name: Verify automated browser test integration
        run: node scripts/ci-test-integration-check.mjs
      - name: Check Discover URL state regressions
        run: node scripts/explore-state-check.mjs
      - name: Check shared runtime selector regressions
        run: node scripts/runtime-selector-check.mjs
      - name: Check link audit syntax
        run: node --check scripts/link-route-asset-audit.mjs
      - name: Audit internal links, routes, fragments, sitemap and custom 404
        run: node scripts/link-route-asset-audit.mjs
      - name: Check Hindi-English static parity audit syntax
        run: node --check scripts/i18n-parity-audit.mjs
      - name: Check offline page metadata language regression
        run: node scripts/offline-metadata-i18n-regression-check.mjs
      - name: Check weather metadata language regression
        run: node scripts/weather-metadata-i18n-regression-check.mjs
      - name: Check weather results language-switch regression
        run: node scripts/weather-results-language-switch-check.mjs
      - name: Check weather sunrise and sunset language regression syntax
        run: node --check scripts/offline-metadata-i18n-regression-check.mjs && node --check scripts/weather-metadata-i18n-regression-check.mjs && node --check scripts/weather-results-language-switch-check.mjs && node --check scripts/weather-time-i18n-regression-check.mjs
      - name: Check weather sunrise and sunset language regression
        run: node scripts/weather-time-i18n-regression-check.mjs
      - name: Audit Hindi-English static parity
        run: node scripts/i18n-parity-audit.mjs
      - name: Check Time page regressions
        run: node scripts/time-page-regression-check.mjs
      - name: Install Chromium browser test dependency
        run: npm install --no-save playwright && npx playwright install chromium
      - name: Run Data Lab browser API diagnostics
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/data-lab-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/data-lab.html > /dev/null; then break; fi
            sleep 0.5
          done
          node scripts/data-lab-browser-diagnostics.mjs
      - name: Run Weather API race-condition browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/everyday-weather-race-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/weather.html > /dev/null; then break; fi
            sleep 0.5
          done
          node scripts/weather-race-condition-test.mjs
      - name: Run Weather API response validation browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/everyday-weather-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/weather.html > /dev/null; then break; fi
            sleep 0.5
          done
          node scripts/weather-api-validation-test.mjs
      - name: Run Time page browser integration tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/everyday-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/time.html > /dev/null; then break; fi
            sleep 0.5
          done
          node scripts/time-page-browser-test.mjs
      - name: Run Discover search regression browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/everyday-discover-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/explore.html > /dev/null; then break; fi
            sleep 0.5
          done
          node scripts/explore-search-browser-test.mjs
      - name: Run Discover search edge-case browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/everyday-discover-edge-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/explore.html > /dev/null; then break; fi
            sleep 0.5
          done
          node scripts/explore-search-edge-cases-test.mjs
      - name: Run interactive controls browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/everyday-controls-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/explore.html > /dev/null; then break; fi
            sleep 0.5
          done
          node scripts/interactive-controls-test.mjs
      - name: Run Service Worker registration browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/everyday-sw-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 0.5
          done
          node scripts/service-worker-registration-test.mjs
          SERVER_PID=$(pgrep -f "http.server 4173" | head -n 1 || true)
          if [ -n "$SERVER_PID" ]; then kill "$SERVER_PID" || true; fi
      - name: Run offline and cache recovery browser tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/everyday-offline-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 0.5
          done
          node scripts/offline-cache-recovery-test.mjs
      - name: Run multi-page site browser smoke test
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/everyday-smoke-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 0.5
          done
          node scripts/site-smoke-test.mjs
      - name: Run dark-mode browser regression tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/everyday-dark-mode-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 0.5
          done
          node scripts/dark-mode-browser-test.mjs
      - name: Run responsive layout smoke tests
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/everyday-responsive-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 0.5
          done
          node scripts/responsive-smoke-test.mjs
      - name: Smoke-test deployed GitHub Pages routes
        run: SITE_BASE_URL=https://pkdiv6548.github.io/Everyday node scripts/site-smoke-test.mjs
      - name: Audit local paths and image reuse
        run: node scripts/content-audit.mjs
      - name: Report potential story-image relevance issues
        run: node scripts/image-relevance-audit.mjs
      - name: Audit story source and media provenance candidates
        run: node scripts/source-provenance-audit.mjs
      - name: Audit category coverage and story integrity
        run: node scripts/category-coverage.mjs
      - name: Upload link audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-route-asset-audit-${{ github.run_id }}
          path: artifacts/link-audit/report.md
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload site smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-smoke-screenshots-${{ github.run_id }}
          path: artifacts/site-smoke/**/*.png
          if-no-files-found: ignore
          retention-days: 14

