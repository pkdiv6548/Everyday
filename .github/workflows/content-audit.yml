name: Everyday content audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js && node --check stories-extra.js
      - name: Audit local paths and image reuse
        run: node scripts/content-audit.mjs
      - name: Audit category coverage and story integrity
        run: node scripts/category-coverage.mjs
