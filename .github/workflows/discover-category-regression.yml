name: Discover category filter regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-category-filters:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Run Discover category filter browser regression
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/everyday-discover-category-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/explore.html > /dev/null; then break; fi
            sleep 0.5
          done
          node scripts/explore-search-browser-test.mjs
